name: Deploy backend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 93.127.186.217
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: false
          script: |
            bash /home/umunsi/backend-api/scripts/deploy-production.sh

# Frontend on umunsi.com is built from this repo and served from backend-api/public.
# Vercel frontend: https://github.com/Kwizera250232/umunsi-frontend
