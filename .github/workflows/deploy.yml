name: Deploy to Hostinger

on:
  workflow_dispatch:  # manual only — auto-deploy handled by webhook server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 93.127.186.217
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: false
          script: |
            cd /home/umunsi/htdocs/umunsi.com
            git pull origin main
            npm install --production --omit=dev
            pm2 restart umunsi-backend 2>/dev/null || pm2 start ecosystem.config.js --env production
            pm2 save
            echo "Deploy complete"
