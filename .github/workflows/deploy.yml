name: Deploy backend to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/pages/**'
      - 'src/components/**'
      - 'index.html'
      - 'vercel.json'
      - 'vite.config.ts'
  workflow_dispatch:

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 93.127.186.217
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script_stop: false
          script: |
            cd /home/umunsi/backend-api
            git pull origin main
            npm install --production --omit=dev
            npx prisma generate
            pm2 restart umunsi-backend 2>/dev/null || pm2 start ecosystem.config.js --env production
            pm2 save
            echo "Backend deploy complete"

# Frontend deploys from https://github.com/Kwizera250232/umunsi-frontend via Vercel
